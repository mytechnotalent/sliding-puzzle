[package]
name = "sliding-puzzle"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Thomas"]
license = "MIT"
description = "A four by four sliding puzzle, written in Rust and compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
